name: Node.js Deployment with NGINX and SSL

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend (tsc)
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Sync build output to VPS
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" dist/ "${{ secrets.USERNAME }}@${{ secrets.HOST }}:/var/www/html/craft/school/api/dist/"

      - name: Restart app on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 15m
          script: |
            set -e
            echo "Starting deployment to VPS..."

            cd /var/www/html/craft/school/api || exit

            echo "Fetching latest code from GitHub..."
            git fetch --all
            git reset --hard origin/main

            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            echo "Installing production dependencies..."
            npm install --omit=dev

            echo "Restarting application using PM2..."
            pm2 restart management-api || pm2 start npm --name "management-api" -- run start

            echo "Deployment completed successfully!"
