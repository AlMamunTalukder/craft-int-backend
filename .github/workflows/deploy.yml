name: Node.js Deployment with NGINX and SSL

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend (tsc)
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to VPS (with retry)
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y rsync
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25"
          DEST="${{ secrets.USERNAME }}@${{ secrets.HOST }}"
          ok=0
          for i in 1 2 3 4 5; do
            if rsync -az --delete -e "ssh $SSH_OPTS" dist/ "$DEST:/var/www/html/craft/school/api/dist/"; then
              ok=1
              break
            fi
            echo "Connection attempt $i/5 failed, retrying in 30s..."
            sleep 30
          done
          [ "$ok" = "1" ] || exit 1

          ssh $SSH_OPTS "$DEST" 'bash -s' <<'EOF'
            set -e
            echo "Starting deployment to VPS..."
            cd /var/www/html/craft/school/api || exit

            echo "Fetching latest code from GitHub..."
            git fetch --all
            git reset --hard origin/main

            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            echo "Installing production dependencies..."
            npm install --omit=dev

            echo "Restarting application using PM2..."
            pm2 restart management-api || pm2 start npm --name "management-api" -- run start

            echo "Deployment completed successfully!"
EOF
