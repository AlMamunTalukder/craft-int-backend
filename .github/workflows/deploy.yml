name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Pull and restart on VPS (with retry)
        run: |
          set -e
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25"
          DEST="${{ secrets.USERNAME }}@${{ secrets.HOST }}"
          ok=0
          for i in 1 2 3 4 5; do
            if ssh $SSH_OPTS "$DEST" 'cd /var/www/html/craft/school/api && git fetch --all && git reset --hard origin/main && if [ ! -f .env ]; then cp .env.example .env; fi && npm install --omit=dev && (pm2 restart management-api || pm2 start npm --name "management-api" -- run start)'; then
              ok=1
              break
            fi
            echo "Connection attempt $i/5 failed, retrying in 30s..."
            sleep 30
          done
          [ "$ok" = "1" ] || exit 1
          echo "Deployment completed successfully!"
